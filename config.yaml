# Daily Momentum Calls — user-owned parameters.
# Every runbook reads this file first. Edit + push to change behavior; the next
# scheduled run picks it up automatically.
#
# WHY each value is what it is: docs/RATIONALE.md. Read it before changing anything —
# most of these are scar tissue from a specific incident, and the reason is rarely
# obvious from the number. Do not "tidy" a threshold without checking there.

# --- Account ------------------------------------------------------------------
account_number: "576391551"                          # "Agentic" cash account (only agentic_allowed one)
scan_id: "5399dce3-8430-476c-ba65-89ac920af0bf"      # saved scanner "Daily Momentum Calls" (>+2%)
scan_id_puts: "1849aba7-1d06-4269-b58f-b4e42d9bfb02" # saved scanner "Daily Momentum Puts" (<-2%, RSI 20-45)
enable_puts: true                # also trade puts on confirmed bearish momentum

# --- Execution authorization --------------------------------------------------
entry_auto_execute: true         # true = standing authorization to buy without asking
exit_auto_execute: true          # true = closes execute without asking

# --- Position sizing ----------------------------------------------------------
min_buying_power_to_trade: 10    # USD; below this the entry run skips the day
max_premium_per_trade_pct_of_daily_start: 25
                                 # Cap per position = this % of account total_value at the
                                 # START of today (captured in premarket, journaled as
                                 # `max_premium_per_trade`; entry.md reads that figure).
                                 # Sizing budget = min(that figure, LIVE buying power);
                                 # take the smaller position rather than skipping.
max_open_positions: 6            # combined across calls AND puts, no fixed split.
                                 # Re-entering the same underlying is allowed; a symbol
                                 # may not hold a call AND a put simultaneously.
max_new_positions_per_day: 30

# --- Contract selection -------------------------------------------------------
dte_min: 7
dte_target: 14                   # pick the expiry in [dte_min, dte_max] CLOSEST to this,
                                 # NOT the nearest. Ties break toward the longer expiry.
dte_max: 21
dte_max_no_weekly: 45            # when no expiry exists in [dte_min, dte_max] (monthly-only
                                 # chains), the nearest monthly up to this DTE is allowed
min_open_interest: 500           # static intraday — a strike that fails stays failed all day
max_spread_pct_of_mid: 10        # spread CAN improve intraday; re-check each cycle
min_quote_size_for_entry: 10     # bid_size AND ask_size, both. Never exception-eligible.
thin_liquidity_oi_threshold: 2500  # below this, flag the position "LIQUIDITY: THIN" for life
                                 # and use the tightened THIN exit values below

# --- Single-gate liquidity exception: PAPER-ONLY SHADOW TEST ------------------
# Review due after the 2026-08-14 close; see entry.md TEMPORARY section.
gate_exception_shadow_only: true # HARD SWITCH — true means paper tracking only
gate_exception_min_oi: 200       # floor if OI is the single failing gate
gate_exception_max_spread_pct: 20  # ceiling if spread is the single failing gate
gate_exception_size_factor: 0.5  # exception trades size at half the normal cap

# --- Exits: the cascade -------------------------------------------------------
# Checked in this order each monitor cycle:
#   hard TP (50) -> scale-out (40) -> ratchet arm (12) -> floors -> otherwise hold
stop_loss_pct: -25               # hard floor. Deliberately NOT scaled when leverage
                                 # halved — that is what widens stop tolerance. Do not touch.
hard_take_profit_pct: 50         # instant sale at mid, no discretion
scale_out_pct: 40                # sell floor(qty/3) once, qty>=2, then raise the stop
scale_out_floor_pct: -15         # remainder's floor after a scale-out, keyed to original entry
take_profit_pct: 12              # ratchet ARMS here (no forced sale)
take_profit_floor_pct: 10        # floor once armed — but see FLOOR CLAMP below
stop_ratchet_trail_pct: 20       # normal trail from high-water mark once armed
stop_ratchet_stall_trail_pct: 10 # tighter trail applied on a STALLING bar
thin_liquidity_take_profit_pct: 8         # THIN arms earlier than normal (8 < 12)
thin_liquidity_stop_ratchet_trail_pct: 15 # THIN trails tighter than normal (15 < 20)
#
# FLOOR CLAMP: the effective floor once armed is
#   min(take_profit_floor_pct, the arm level that applied)
# = 10 normally, 8 for THIN. Without this a THIN position arming at +8% against a +10%
# floor would need a stop ABOVE the mark at the instant of arming, forcing an instant sell.
#
# INVARIANTS (assert before changing any of the above):
#   arm 12 < scale-out 40 < hard TP 50 · THIN arm 8 < arm 12
#   THIN trail 15 < trail 20 · stall 10 < THIN trail 15

# --- Exits: pre-arm floors (no-ops once the ratchet arms) ---------------------
early_floor_trigger_pct: 8       # first touch of +8% ...
early_floor_pct: -3              # ... raises the floor to -3% (just below breakeven)
midday_floor_trigger_pct: 3      # inside the midday window, first touch of +3% ...
midday_floor_pct: 0              # ... raises the floor to breakeven
midday_floor_window_start_et: "11:30"
midday_floor_window_end_et: "13:30"
late_day_floor_trigger_pct: 5    # inside the late window, first touch of +5% ...
late_day_floor_pct: 5            # ... locks in +5% (trigger = floor; banks real profit)
late_day_floor_window_start_et: "13:30"
late_day_floor_window_end_et: "15:00"
# Whenever several floors are eligible, take the highest. Stops only ever move UP.

# --- Order mechanics ----------------------------------------------------------
resting_order_type: "stop_loss"  # "stop_loss" = resting stop at the stop level (monitor
                                 # handles profit-taking) | "take_profit" = the inverse
min_quote_size_for_stop_update: 5  # bid AND ask must both clear before any stop
                                 # cancel+replace. Only ever DELAYS raising a stop.
ratchet_stop_type: "stop_limit"  # once armed, switch the resting stop to stop_limit to
                                 # bound slippage. "stop_market" disables.
ratchet_stop_limit_buffer_pct: 5 # limit = stop x (1 - this/100)
ratchet_stop_limit_cutoff_et: "15:30"  # past this, revert to stop_market — certainty of
                                 # getting flat beats bounding slippage this late
blackout_stop_check_interval_sec: 30  # edge case only: software stop-check cadence if a
                                 # stop_market is unexpectedly rejected in the 9:30-9:45
                                 # blackout. Normal path is a stop_limit, upgraded at 9:45.
forced_close_start_et: "15:40"   # begin flattening
forced_close_cross_et: "15:53"   # cross the spread if still open

# --- Signal thresholds --------------------------------------------------------
min_day_change_pct: 2            # underlying must move at least this % in the trade
                                 # direction. NOTE: measures against YESTERDAY's close and
                                 # says nothing about who is winning today — the
                                 # above-open and VWAP gates do that. (W, 2026-08-14:
                                 # crossed +2% while fading all day from its own open.)

# --- Opening gap-fade guard ---------------------------------------------------
# BLOCKING-ONLY: can veto a candidate, never promote one. Worst case is a missed trade.
# UNDER REVIEW — the live record is weaker than the derivation (Gate A passed 4 names,
# 3 closed below their open; Gate B is structurally biased against the strongest trends
# because it measures from a RATCHETING session high). See docs/RATIONALE.md before
# changing. Do not tighten on current evidence. Set enabled: false to disable both.
opening_fade_guard_enabled: true
opening_fade_guard_min_gap_pct: 5     # gates apply only to names that actually gapped this much
opening_bar_min_close_position: 0.50  # GATE A: first 5-min RTH bar must close in the upper
                                 # half of its range for a call (lower half for a put).
                                 # Cleared not by the clock but by a volume-confirmed 5-min
                                 # close back above that bar's high.
opening_window_chase_guard_pct: 1.5   # GATE B: before opening_window_end_et, reject an entry
                                 # within this % of the session high (session low for puts)
opening_window_end_et: "10:30"   # Gate B inactive after this. Gate A has no time limit.
