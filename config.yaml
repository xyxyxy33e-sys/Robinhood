# Daily Momentum Calls — user-owned parameters.
# Every runbook reads this file first. Edit + push to change behavior; the next
# scheduled run picks it up automatically.

account_number: "576391551"                       # "Agentic" cash account (the only agentic_allowed account)
scan_id: "5399dce3-8430-476c-ba65-89ac920af0bf"   # saved Robinhood scanner "Daily Momentum Calls" (bullish, % change > +2%)
scan_id_puts: "1849aba7-1d06-4269-b58f-b4e42d9bfb02"  # saved scanner "Daily Momentum Puts" (bearish, % change < -2%, RSI 20-45)
enable_puts: true                                 # true: also trade puts on confirmed bearish momentum (added 2026-07-21)

# --- Execution authorization -------------------------------------------------
# entry_auto_execute=true is your standing instruction to buy without asking.
entry_auto_execute: true   # false: review order + ask for confirmation before buying
exit_auto_execute: true     # true: closes (TP/SL/forced flat) execute without asking

# --- Position sizing ---------------------------------------------------------
min_buying_power_to_trade: 10    # USD; below this the entry run skips the day
max_premium_per_trade: 1500       # USD flat cap per position — sizing uses this figure
                                 # alone, not live buying power (user-removed 2026-07-21).
                                 # If actual settled cash is insufficient the order will
                                 # simply be rejected/fail at the broker.
# Contracts per trade: quantity = floor(max_premium_per_trade / (premium × 100)),
# minimum 1 — multiple contracts of the same call (or put) are allowed.
max_open_calls: 3                # up to 3 concurrent call positions...
max_open_puts: 3                 # ...and up to 3 concurrent put positions (up to 6 total).
                                 # Re-entering the same underlying is allowed — no
                                 # one-position-per-symbol limit and no "never re-buy after
                                 # a stop-out" rule (both removed 2026-07-21 per user
                                 # instruction). A symbol still can't hold a call AND a put
                                 # at the same time.
max_new_positions_per_day: 30

# --- Contract selection ------------------------------------------------------
dte_min: 1                       # 0DTE excluded: never buy a contract expiring today
dte_max: 21                      # preferred window...
dte_max_no_weekly: 45            # ...but when an underlying has NO expiry in [dte_min,
                                 # dte_max] (monthly-only chains like TRV), the nearest
                                 # monthly up to this DTE is allowed (user-approved 2026-07-17)
min_open_interest: 500
max_spread_pct_of_mid: 10        # skip contracts with wider bid-ask

# --- Intraday risk -----------------------------------------------------------
# Robinhood holds only ONE sell order per contract (no OCO for options), so only one of
# the two protective orders can rest broker-side; the monitor loop enforces the other.
resting_order_type: "stop_loss"  # "stop_loss" (default: resting stop_market at the stop
                                 # level; monitor handles profit-taking) or "take_profit"
                                 # (resting sell limit at the target; monitor handles stops)
take_profit_pct: 50              # profit target: entry premium × (1 + this%)
stop_loss_pct: -30               # hard floor: entry premium × (1 + this%)
forced_close_start_et: "15:40"   # begin flattening
forced_close_cross_et: "15:53"   # cross the spread if still open

# --- Signal thresholds -------------------------------------------------------
min_day_change_pct: 2            # underlying must move at least this % (up for calls,
                                 # down for puts) at entry check
