# Daily Momentum Calls — user-owned parameters.
# Every runbook reads this file first. Edit + push to change behavior; the next
# scheduled run picks it up automatically.

account_number: "576391551"                       # "Agentic" cash account (the only agentic_allowed account)
scan_id: "5399dce3-8430-476c-ba65-89ac920af0bf"   # saved Robinhood scanner "Daily Momentum Calls" (bullish, % change > +2%)
scan_id_puts: "1849aba7-1d06-4269-b58f-b4e42d9bfb02"  # saved scanner "Daily Momentum Puts" (bearish, % change < -2%, RSI 20-45)
enable_puts: true                                 # true: also trade puts on confirmed bearish momentum (added 2026-07-21)

# --- Execution authorization -------------------------------------------------
# entry_auto_execute=true is your standing instruction to buy without asking.
entry_auto_execute: true   # false: review order + ask for confirmation before buying
exit_auto_execute: true     # true: closes (TP/SL/forced flat) execute without asking

# --- Position sizing ---------------------------------------------------------
min_buying_power_to_trade: 10    # USD; below this the entry run skips the day
max_premium_per_trade_pct_of_daily_start: 25
                                 # Cap per position = this % of the account's total_value
                                 # at the START of today's trading day (changed from a
                                 # flat $2000 cap on 2026-07-23 per user). "Daily start" =
                                 # prior session's closing account value (this is a cash
                                 # account, flat on options overnight, so last night's
                                 # close IS this morning's open) — captured via
                                 # get_portfolio in the premarket runbook, before any
                                 # entries, and journaled as `daily_start_balance` +
                                 # `max_premium_per_trade` (the computed dollar figure)
                                 # for entry.md to read. Recomputed fresh every morning;
                                 # sizing still uses this computed figure alone, not live
                                 # buying power. If actual settled cash is insufficient the
                                 # order will simply be rejected/fail at the broker.
                                 # Today (2026-07-23): daily_start_balance $10,286.87 (per
                                 # 2026-07-22 EOD report, captured retroactively since
                                 # today's premarket run predates this rule) -> effective
                                 # max_premium_per_trade = $2,571.72 for the rest of today.
# Contracts per trade: quantity = floor(max_premium_per_trade / (premium × 100)),
# minimum 1 — multiple contracts of the same call (or put) are allowed.
max_open_positions: 6            # combined cap across calls AND puts together (changed
                                 # 2026-07-28 per user from separate max_open_calls=5 /
                                 # max_open_puts=5 [10 total] back to a single combined
                                 # limit — up to 6 total open positions, any mix of calls
                                 # and puts, no fixed split between the two).
                                 # Re-entering the same underlying is allowed — no
                                 # one-position-per-symbol limit and no "never re-buy after
                                 # a stop-out" rule (both removed 2026-07-21 per user
                                 # instruction). A symbol still can't hold a call AND a put
                                 # at the same time.
max_new_positions_per_day: 30

# --- Contract selection ------------------------------------------------------
dte_min: 2                       # 0 and 1 DTE excluded (raised from 1 on 2026-07-21: a
                                 # 1-DTE MU contract hit the -30% floor in 20 minutes on a
                                 # modest pullback — extreme theta/gamma, not the thesis,
                                 # drove the speed of the loss)
dte_max: 21                      # preferred window...
dte_max_no_weekly: 45            # ...but when an underlying has NO expiry in [dte_min,
                                 # dte_max] (monthly-only chains like TRV), the nearest
                                 # monthly up to this DTE is allowed (user-approved 2026-07-17)
min_open_interest: 500
max_spread_pct_of_mid: 10        # skip contracts with wider bid-ask

# --- Intraday risk -----------------------------------------------------------
# Robinhood holds only ONE sell order per contract (no OCO for options), so only one of
# the two protective orders can rest broker-side; the monitor loop enforces the other.
resting_order_type: "stop_loss"  # "stop_loss" (default: resting stop_market at the stop
                                 # level; monitor handles profit-taking) or "take_profit"
                                 # (resting sell limit at the target; monitor handles stops)
scale_out_pct: 40                # partial profit lock (added 2026-07-23 per user, after
                                 # GOOGL peaked +44.1% — under the +50% ratchet arm — and
                                 # round-tripped to −3.9%): on positions holding 2+
                                 # contracts, when the mark FIRST touches entry ×
                                 # (1 + this%), sell floor(quantity/3) contracts (min 1)
                                 # at mid. Once per position per day. Mechanics: cancel
                                 # the resting stop, place the partial sell, confirm the
                                 # fill, re-place the resting stop for the REMAINING
                                 # quantity at the same (or ratcheted) stop price.
                                 # 1-contract positions skip this — nothing to split.
scale_out_floor_pct: -15         # after a scale-out fills, the remainder's stop is raised
                                 # to at least entry × (1 + this%/100) (rounded to tick,
                                 # keyed to ORIGINAL entry; stops only move up). Guarantees
                                 # the whole trade stays net-positive once the scale-out
                                 # banks (1/3 × 40% > 2/3 × 15%) while sitting below normal
                                 # chop. Superseded by the ratchet's breakeven+ trail once
                                 # +50% arms. (Added 2026-07-23; breakeven floor evaluated
                                 # and rejected — would have chopped out GOOGL's remainder
                                 # in the −3.9% midday dip.)
                                 # RE-BUY of the scaled-out tranche (user-approved
                                 # 2026-07-23, LIGHTER bar than leader re-entry): while the
                                 # remainder is still open, the sold tranche (up to the
                                 # scaled-out quantity, same contract) may be re-bought on
                                 # a 5-min close with the underlying back on the trade-
                                 # direction side of VWAP — no volume/15-min sustain
                                 # requirement. Once per position per day, before 3:00 PM
                                 # ET, settled cash only (the scale-out proceeds settle
                                 # T+1 and cannot fund it), restores the position to at
                                 # most its original size. After the re-buy, the resting
                                 # stop is cancelled and re-placed for the full new
                                 # quantity at the same (unchanged) stop level.
take_profit_pct: 20              # ratchet trigger (lowered from 50 to 20 on 2026-07-28
                                 # per user, same day as the hard-TP change below —
                                 # "start considering sale" at +20%): when the mark first
                                 # touches entry × (1 + this%), the stop ratchet arms (see
                                 # below) — required stop rises toward the high-water
                                 # mark, tightening the leash, but no forced sale yet. The
                                 # winner can keep running under this discretion/trailing
                                 # window between +20% and the +30% hard cap, where it is
                                 # forced out regardless. Un-dormants the ratchet from
                                 # its brief window at 50% (which the +30% hard-TP had
                                 # made unreachable).
stop_loss_pct: -30               # hard floor: entry premium × (1 + this%)
hard_take_profit_pct: 30         # instant sale: mark ≥ entry × (1 + this%) → cancel the
                                 # resting stop and sell-to-close at mid NOW, no
                                 # discretion (lowered from 100 to 30 on 2026-07-28 per
                                 # user — today's MU/AMD/MRVL puts each peaked +21% to
                                 # +35% intraday, then round-tripped to breakeven/red
                                 # before the old 50%-ratchet or 100%-hard-TP ever
                                 # engaged). Software-side via the monitor loop —
                                 # Robinhood holds only one resting sell per contract and
                                 # the stop keeps that slot. Checked BEFORE scale-out and
                                 # the ratchet in the monitor loop, since it now fires
                                 # first and closes the FULL position once reached. The
                                 # +20% ratchet-arm above now gives a live 20%-30% window
                                 # to trail before the hard cap fires. `scale_out_pct`
                                 # (40%) remains above the hard cap and is still dormant.
stop_ratchet_trail_pct: 30       # once armed (mark touched the take_profit level), the
                                 # resting stop is raised to max(breakeven, high-water
                                 # mark × (1 − this%/100)), rounded to tick, and only ever
                                 # moves UP — a big winner can no longer round-trip below
                                 # breakeven (added 2026-07-21 after NBIS peaked +113%
                                 # with the stop still at −30%)
forced_close_start_et: "15:40"   # begin flattening
forced_close_cross_et: "15:53"   # cross the spread if still open

# --- Signal thresholds -------------------------------------------------------
min_day_change_pct: 2            # underlying must move at least this % (up for calls,
                                 # down for puts) at entry check
